<!DOCTYPE html>
<html>
    <head>
        <title>Starfy</title>
        <link rel="icon" href="https://files.catbox.moe/d9qmb3.png">
        <style>
            * { 
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            .body{
                padding: 0;
                margin: 0;
            }
            .main-head{
                width: 100%;
                height: 100px;
                background-image: url(https://i.pinimg.com/736x/75/bf/0b/75bf0b210a9db62fcfdeab8aff6e8339.jpg);
                background-color: rgb(30, 30, 141);
                padding:10px;
            }
            .box{
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .main-area{
                width: 100%;
                height: calc(100vh - 100px);
                background-color: #335383;
                display: flex;
                justify-content: center; 
                align-items: center;
            }
            .spotify-button {
                background-color: #1DB954; 
                color: white;
                display: flex;
                gap: 5px;
                font-weight: bold;
                padding: 15px 40px;
                font-size: 20px;
                border: none;
                border-radius: 30px;
                cursor: pointer;
            }
            
        </style>
    </head>
    <body style="background-color: rgb(139, 184, 232);">
        <div class="main-head">
            <div style="text-align: left; width: 120px; height: 80px;">
                <img src="https://files.catbox.moe/ld3l1v.png" class="box">
            </div>
        </div>
        <hr color="black">
        <div class="main-area">
            <button class="spotify-button"><img src="https://api.iconify.design/fa6-brands:spotify.svg?color=white" width="25" height="25">Connect to Spotify</button>
        </div>
        <div style="max-height: 900px; position: absolute; left: 300px; bottom: 100px; z-index: 9999;">
                <img src="https://i.ibb.co/bMFB2d7y/Gemini-Generated-mage-3gfzam3gfzam3gfz-removebg-preview.png" height="400px" width="400px">
        </div>
         <div style="max-height: 900px; position: absolute; right: 570px; bottom: 340px; z-index: 9999;">
                <img src="https://i.ibb.co/pj9dy1tT/okokok-removebg-preview.png" height="300px" width="300px">
        </div>
         <div style="max-height: 900px; position: absolute; right: 30px; bottom: 30px; z-index: 9999;">
                <img src="https://i.ibb.co/FkSwJj8j/starsblack-removebg-preview.png" height="270px" width="270px">
        </div>
        

    </body>
</html>
