<!DOCTYPE html>
<html>
    <head>
        <title>Starfy</title>
        <link rel="icon" href="https://files.catbox.moe/d9qmb3.png">
        <style>
            * { 
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            .body{
                padding: 0;
                margin: 0;
            }
            .main-head{
                width: 100%;
                height: 100px;
                background-color: rgb(0 , 0 , 128);
                padding:10px;
            }
            .box{
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .main-area{
                width: 100%;
                height: calc(100vh - 100px);
                background-color: #8BB8E8;
                display: flex;
                justify-content: center; 
                align-items: center;
            }
            .spotify-button {
                background-color: #1DB954; 
                color: white;
                display: flex;
                gap: 5px;
                font-weight: bold;
                padding: 15px 40px;
                font-size: 20px;
                border: none;
                border-radius: 30px;
                cursor: pointer;
            }
            
        </style>
    </head>
    <body style="background-color: rgb(139, 184, 232);">
        <div class="main-head">
            <div style="text-align: left; width: 120px; height: 80px;">
                <img src="https://files.catbox.moe/ld3l1v.png" class="box">
            </div>
        </div>
        <hr color="black">
        <div class="main-area">
            <button class="spotify-button"><img src="https://api.iconify.design/fa6-brands:spotify.svg?color=white" width="25" height="25">Connect to Spotify</button>
        </div>
    </body>
</html>
